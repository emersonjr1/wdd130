<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionario Online</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>
<body>
    <header>
        <h1>Questionario de HTML e CSS</h1>
    </header>
    <main>
        <form>
            <div>
                <label for="q1">1. O que significa a sigla CSS?</label>
                <input type="text" name="q1" id="q1">
            </div>
            <div>
                <label for="q2">2. Como os atributos "id" e "class" são selecionados no CSS? Explique com suas palavras.</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
            <div>
                <label for="q3">3. Qual das opções abaixo é um comentário CSS válido?</label>
                <select name="q3" id="q3">
                    <option value="" disabled selected>Escolha uma...</option>
                    <option value="incorreto_1">// Este é um comentário</option>
                    <option value="incorreto_2">&lt;!-- Este é um comentário --&gt;</option>
                    <option value="correto">/* Este é um comentário */</option>
                </select>
            </div>
            <div>
                <label for="q4">4. Quantas cores principais existem no modelo RGB?</label>
                <input type="number" name="q4" id="q4">
            </div>
            <button type="submit">Enviar Questionário</button>
        </form>
    </main>
    
</body>
</html>
