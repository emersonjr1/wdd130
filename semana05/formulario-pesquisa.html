<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>
<body>
    <header>
        <h1>
            WDD 130 | Formulário HTML - Enquete do Usuário
        </h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Informações de Contato</legend>
                <div class="item-formulario coluna2">
                    <label for="nomecompleto">Nome Completo: </label>
                    <input type="text" id="nome-completo" name="nome-completo" required>
                </div>
                <div class="item-formulario coluna2">
                    <label for="emaildousuario">E-mail:</label>
                    <input type="email" id="email-do-usuario" name="email-do-usuario" required>
                </div>
            </fieldset>
            <fieldset>
                <legend>Perguntas</legend>
                <div class="item-formulario coluna1">
                    <label for="navegador">Qual é seu navegador preferido?</label>
                    <select name="navegador" id="navegador">
                        <option value="1">Chrome</option>
                        <option value="2">Safari</option>
                        <option value="3">Edge</option>
                        <option value="4">Brave</option>
                    </select>
                </div>
                <div class="item-formulario coluna1">
                    <label>Você tem um bichinho de estimação?</label>
                    <div>
                        <input type="checkbox" name="pet" id="pet_sim" value="sim">
                        <label for="pet_sim">Sim</label>
                        <input type="checkbox" name="pet" id="pet_nao" value="nao">
                        <label for="pet_nao">Não</label>
                    </div>
                </div>
                <div class="item-formulario coluna2">
                    <label for="lugares">Lugares onde morou:</label>
                    <textarea id="lugares" name="lugares" rows="4"></textarea>
                </div>
            </fieldset>
                <button type="submit">
                    Enviar Pesquisa
                </button>
        
        </form>
    </main>
    <footer>
        <p>
            c2024 | Formulario HTML - Atividade de Pesquisa de Usuarios | Emerson M. Junior
        </p>
    </footer>

    
</body>
</html>
